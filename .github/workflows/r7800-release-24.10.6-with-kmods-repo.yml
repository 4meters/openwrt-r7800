name: Build Netgear r7800 - release (24.10.6) - with kmods repo

on:
  repository_dispatch:
  workflow_dispatch:

env:
  OPENWRT_DEVICE_MODEL: netgear_r7800
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update && sudo apt-get -qq upgrade
          sudo apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
          sudo apt-get -qq autoremove --purge
          sudo apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Maximize build disk space
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Checkout
        uses: actions/checkout@main

      - name: Download the sources
        run: |
          git clone https://${{ secrets.GITHUB_TOKEN }}@github.com/4meters/openwrt-r7800
          cd openwrt-r7800
          mkdir luci-patches
          cp -r ./feeds/luci/modules/* ./luci-patches
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp -r ./luci-patches/* ./feeds/luci/modules
          cp ./.github/.config ./.config

      - name: Add usign public key and uci-default
        run: |
          cd openwrt-r7800
          mkdir -p files/etc/opkg/keys
          echo "$USIGN_PUBLIC_KEY" > files/etc/opkg/keys/$USIGN_PUBLIC_KEY_ID
          chmod 644 files/etc/opkg/keys/0bd2b244521c2eff
          
          cat << 'EOF' > files/etc/uci-defaults/99-add-kmods-repo
          #!/bin/sh

          KERNEL_VER=$(opkg list-installed kernel | awk '{print $3}')
          FEED_URL="https://4meters.github.io/repo/kmods-r7800-nss/$KERNEL_VER"

          sed -i '/kmods-r7800-nss/d' /etc/opkg/customfeeds.conf
          echo "src/gz kmods $FEED_URL" >> /etc/opkg/customfeeds.conf

          exit 0
          EOF

          chmod +x files/etc/uci-defaults/99-add-kmods-repo
        env:
          USIGN_PUBLIC_KEY: ${{ secrets.USIGN_PUBLIC_KEY }}
          USIGN_PUBLIC_KEY_ID: ${{ secrets.USIGN_PUBLIC_KEY_ID }}

      - name: Build the firmware image
        run: |
          cd openwrt-r7800
          IGNORE_ERRORS=m make -j$(nproc) || IGNORE_ERRORS=m make -j1 V=s

      - name: Prepare kmods feed + sign
        env:
          USIGN_PRIVATE_KEY: ${{ secrets.USIGN_PRIVATE_KEY }}
        run: |
          cd openwrt-r7800
          
          # Extract kernel ABI version
          KERNEL_VER=$(awk '/^Package: kernel/{getline; print $2}' \
            bin/targets/ipq806x/generic/packages/Packages)
          
          echo "Kernel ABI: $KERNEL_VER"
          
          # Prepare feed dir
          FEED_DIR=./kmods/$KERNEL_VER
          mkdir -p $FEED_DIR
          
          # Copy kmods
          cp bin/targets/ipq806x/generic/packages/kmod-*.ipk $FEED_DIR/
          
          cd $FEED_DIR
          
          # Generate index
          ../../../staging_dir/host/bin/opkg-make-index . > Packages
          gzip -k Packages
          
          # Load private key
          echo "$USIGN_PRIVATE_KEY" > key-build
          chmod 600 key-build
          
          # Sign Packages
          ../../../staging_dir/host/bin/usign -S -m Packages -s key-build

      - name: Deploy kmods feed to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./openwrt-r7800/kmods
          destination_dir: kmods-r7800

      - name: Organize files
        run: |
          cp ./openwrt-r7800/bin/targets/ipq806x/generic/openwrt-ipq806x-generic-netgear_r7800.manifest ./openwrt-24.10.6-NSS-ipq806x-generic-netgear_r7800.manifest
          cp ./openwrt-r7800/bin/targets/ipq806x/generic/openwrt-ipq806x-generic-netgear_r7800-squashfs-factory.img ./openwrt-24.10.6-NSS-ipq806x-generic-netgear_r7800-squashfs-factory.img
          cp ./openwrt-r7800/bin/targets/ipq806x/generic/openwrt-ipq806x-generic-netgear_r7800-squashfs-sysupgrade.bin ./openwrt-24.10.6-NSS-ipq806x-generic-netgear_r7800-squashfs-sysupgrade.bin
          
          tar -zcvf kmods-openwrt-24.10.6-NSS-${{ env.OPENWRT_DEVICE_MODEL }}.tar.gz \
            -C ./openwrt-r7800/bin/targets/ipq806x/generic/packages \
            $(find ./openwrt-r7800/bin/targets/ipq806x/generic/packages -name 'kmod-*.ipk' -printf '%P\n')

      - name: Generate release tag
        id: snapshottag
        run: |
          echo "release_tag=24.10.6-nss-release_$(date +"%Y-%m-%d")" >> $GITHUB_OUTPUT

      - name: Upload release firmware
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.snapshottag.outputs.release_tag }}-${{ env.OPENWRT_DEVICE_MODEL }}
          files: |
            openwrt-24.10.6-NSS-ipq806x-generic-netgear_r7800.manifest
            openwrt-24.10.6-NSS-ipq806x-generic-netgear_r7800-squashfs-factory.img
            openwrt-24.10.6-NSS-ipq806x-generic-netgear_r7800-squashfs-sysupgrade.bin
            kmods-openwrt-24.10.6-NSS-${{ env.OPENWRT_DEVICE_MODEL }}.tar.gz

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 2