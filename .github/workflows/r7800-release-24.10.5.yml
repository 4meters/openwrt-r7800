name: Build Netgear r7800 - release (24.10.5)

on:
  repository_dispatch:
  workflow_dispatch:
    branches:
      - master

env:
  OPENWRT_DEVICE_MODEL: netgear_r7800
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get -qq update && sudo apt-get -qq upgrade
        sudo apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
        sudo apt-get -qq autoremove --purge
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Maximize build disk space
      uses: easimon/maximize-build-space@master
      with:
        remove-dotnet: true
        remove-android: true
        remove-haskell: true
        remove-codeql: true
        remove-docker-images: true

    - name: Checkout
      uses: actions/checkout@main

    - name: Download the sources
      run: |
        git clone https://github.com/4meters/openwrt-r7800
        cd openwrt-r7800
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        cp ./.github/.config .config

    - name: Build the firmware image
      id: compile
      run: |
        IGNORE_ERRORS=m make -j$(($(nproc)+1)) defconfig download clean world || IGNORE_ERRORS=m make -j1 defconfig download clean world V=s

    - name: Organize files
      run: |
        tar -zcvf All_Packages.tar.gz ./bin/packages
        tar -zcvf All_Firmwares.tar.gz ./bin/targets

    - name: Generate release Release Tag
      id: snapshottag
      run: |
        echo "release_tag=24.10.5-nss-release_$(date +"%Y-%m-%d")" >> $GITHUB_OUTPUT

    - name: Upload release firmware to Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.snapshottag.outputs.release_tag }}-${{ env.OPENWRT_DEVICE_MODEL }}
        files: |
          All_Packages-$OPENWRT_DEVICE_MODEL-NSS.tar.gz
          All_Firmwares-$OPENWRT_DEVICE_MODEL-NSS.tar.gz

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 2
