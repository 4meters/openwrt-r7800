name: Add kmods repo for last build

on:
  workflow_dispatch:
  repository_dispatch:

env:
  OPENWRT_DEVICE_MODEL: netgear_r7800
  TZ: UTC

permissions:
  actions: read
  contents: write   # needed for gh-pages deploy

jobs:
  kmods-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact (from triggering run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          mkdir artifact
          cd artifact

          echo "== Downloading artifact from run: 23684291798 =="

          wget https://productionresultssa12.blob.core.windows.net/actions-results/ed6a9982-ee73-4df6-92d5-68dbc0292344/workflow-job-run-7b1c0870-ea96-541a-8dfd-fb2be4247a82/artifacts/d21e6e003bd9c65ff1e0560835f13e6d5ad28493132ce8b6a7ec9889c7352c60.zip?rscd=attachment%3B+filename%3D%22openwrt-build-r7800.zip%22&rsct=application%2Fzip&se=2026-03-28T19%3A16%3A07Z&sig=gBZNc3pHtaPpYxfjWgN0Ye7aDnOYSOolJmVbPtMcI%2Bs%3D&ske=2026-03-28T22%3A11%3A43Z&skoid=ca7593d4-ee42-46cd-af88-8b886a2f84eb&sks=b&skt=2026-03-28T18%3A11%3A43Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2025-11-05&sp=r&spr=https&sr=b&st=2026-03-28T19%3A06%3A02Z&sv=2025-11-05

          echo "== Downloaded files =="
          ls -l

      - name: Extract build artifact
        run: |
          set -e
          tar -xzf artifact/openwrt-build-r7800.tar.gz

      - name: Prepare kmods feed + sign
        env:
          USIGN_PRIVATE_KEY: ${{ secrets.USIGN_PRIVATE_KEY }}
        run: |
          set -e

          cd openwrt-r7800

          echo "== Debug: listing packages dir =="
          ls -l bin/targets/ipq806x/generic/packages/ || exit 1

          echo "== Debug: preview Packages file =="
          head -20 bin/targets/ipq806x/generic/packages/Packages || exit 1

          # ✅ Stable kernel ABI extraction
          KERNEL_VER=$(grep -m1 -oP 'kernel \(=\K[^)]+' bin/targets/ipq806x/generic/packages/Packages)

          if [ -z "$KERNEL_VER" ]; then
            echo "ERROR: Kernel ABI not found"
            exit 1
          fi

          echo "Kernel ABI: $KERNEL_VER"

          FEED_DIR=./kmods/$KERNEL_VER
          mkdir -p "$FEED_DIR"

          cp bin/targets/ipq806x/generic/packages/kmod-*.ipk "$FEED_DIR/"

          cd "$FEED_DIR"

          TOPDIR=$(realpath ../../)

          echo "== Generating Packages index =="
          "$TOPDIR/staging_dir/host/bin/opkg-make-index" . > Packages
          gzip -k Packages

          echo "== Writing signing key =="
          printf "%s" "$USIGN_PRIVATE_KEY" > key-build
          chmod 600 key-build

          echo "== Signing Packages =="
          "$TOPDIR/staging_dir/host/bin/usign" -S -m Packages -s key-build

          rm key-build
          
          echo "== Done =="
          ls -l

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./openwrt-r7800/kmods
          destination_dir: kmods-r7800